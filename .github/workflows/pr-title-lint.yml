---
# The changelog is written from pull request titles, so they follow
# Conventional Commits: <type>(<scope>)?: <subject>, with type one of feat,
# fix, docs, style, refactor, perf, test, build, ci, chore or revert.
name: PR Title Lint
on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
